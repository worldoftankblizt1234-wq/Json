<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Age of Strategy - AoH Multiplayer</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ===== FIREBASE CONFIG (NHÚNG TRỰC TIẾP) ===== -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
  </script>

  <style>
    /* Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background: #0b1329;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* Map Viewport */
    #map-viewport {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      overflow: hidden;
      position: relative;
      background: #1a3a5a;
      touch-action: none;
    }
    #map-viewport:active {
      cursor: grabbing;
    }

    #map-container {
      transform-origin: 0 0;
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
    }
    #map-container svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Province Styles */
    #map-container path {
      stroke: #1e293b;
      stroke-width: 0.7px;
      transition: fill 0.2s, stroke 0.2s, filter 0.2s;
      cursor: pointer;
      vector-effect: non-scaling-stroke;
    }
    #map-container path:hover {
      filter: brightness(1.25);
      stroke: #ffffff;
      stroke-width: 1.5px;
    }
    #map-container path.selected {
      stroke: #f59e0b !important;
      stroke-width: 2.5px !important;
      filter: brightness(1.3);
    }
    #map-container path.target {
      stroke: #ef4444 !important;
      stroke-width: 2.5px !important;
      animation: pulse-red 1s infinite alternate;
    }
    @keyframes pulse-red {
      0% {
        filter: brightness(1);
      }
      100% {
        filter: brightness(1.6);
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 3px;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: #0f1a2e;
      border: 1px solid #2a3a5a;
      border-radius: 20px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-box {
      transform: scale(1);
    }

    /* Country Card */
    .country-card {
      background: #1a2a4a;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .country-card:hover {
      background: #2a3a5a;
      transform: translateY(-2px);
    }
    .country-card.selected {
      border-color: #f59e0b;
      background: #2a3a5a;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.15);
    }
    .country-card.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .country-card .flag-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #e2e8f0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 95vw;
    }
    .top-bar .sep {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.1);
    }
    .top-bar .stat {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-bar .stat i {
      font-size: 14px;
      opacity: 0.7;
    }
    .top-bar .stat .value {
      font-weight: 600;
    }

    /* Notifications */
    #notification-container {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      max-width: 90vw;
      width: 500px;
    }
    .notification {
      pointer-events: auto;
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(0);
      opacity: 1;
      transition: all 0.4s ease;
    }
    .notification.info {
      background: rgba(30, 58, 95, 0.95);
      border-color: #3b82f6;
    }
    .notification.success {
      background: rgba(20, 60, 40, 0.95);
      border-color: #22c55e;
    }
    .notification.warning {
      background: rgba(80, 60, 20, 0.95);
      border-color: #eab308;
    }
    .notification.danger {
      background: rgba(80, 20, 20, 0.95);
      border-color: #ef4444;
    }
    .notification.fade-out {
      transform: translateY(-20px);
      opacity: 0;
    }

    /* Buttons */
    .btn-primary {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-danger:hover {
      transform: scale(1.02);
    }

    /* Panel */
    .province-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 50;
      width: 320px;
      max-width: calc(100vw - 40px);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(calc(100% + 30px));
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .province-panel.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* Mini Map */
    #minimap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 40;
      width: 150px;
      height: 150px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }
    #minimap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .top-bar {
        font-size: 11px;
        padding: 6px 12px;
        gap: 8px;
        top: 8px;
      }
      .top-bar .sep {
        height: 16px;
      }
      .province-panel {
        width: calc(100vw - 30px);
        bottom: 10px;
        left: 15px;
        padding: 16px;
      }
      #minimap {
        width: 100px;
        height: 100px;
        bottom: 10px;
        right: 10px;
      }
      .modal-box {
        padding: 20px;
        margin: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== LOADING ===== -->
  <div id="loading" class="fixed inset-0 z-[999] flex items-center justify-center bg-[#0b1329]">
    <div class="text-center">
      <div class="w-16 h-16 border-4 border-amber-400/30 border-t-amber-400 rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-slate-400 text-sm">Đang tải dữ liệu...</p>
    </div>
  </div>

  <!-- ===== MAP VIEWPORT ===== -->
  <div id="map-viewport">
    <div id="map-container">
      <div id="svg-holder"></div>
    </div>
  </div>

  <!-- ===== TOP BAR ===== -->
  <div class="top-bar" id="topBar">
    <div class="stat">
      <i class="fa-solid fa-flag text-amber-400"></i>
      <span id="player-country-display" class="font-medium">---</span>
    </div>
    <div class="sep"></div>
    <div class="stat">
      <i class="fa-solid fa-coins text-yellow-400"></i>
      <span class="value text-emerald-400" id="goldDisplay">0</span>
    </div>
    <div class="stat">
      <i class="fa-solid fa-users text-blue-400"></i>
      <span class="value text-blue-300" id="manpowerDisplay">0</span>
    </div>
    <div class="stat">
      <i class="fa-solid fa-oil-well text-orange-400"></i>
      <span class="value text-orange-300" id="oilDisplay">0</span>
    </div>
    <div class="sep"></div>
    <div class="stat">
      <i class="fa-solid fa-hourglass-half text-amber-300"></i>
      <span>Lượt: <strong id="turnDisplay" class="text-amber-300">0</strong></span>
    </div>
    <div class="stat">
      <i class="fa-solid fa-swords text-red-400"></i>
      <span class="value text-red-300" id="warCountDisplay">0</span>
    </div>
    <div class="sep"></div>
    <div id="turnIndicator" class="text-xs font-medium text-yellow-400">⏳ Đợi lượt...</div>
  </div>

  <!-- ===== NOTIFICATIONS ===== -->
  <div id="notification-container"></div>

  <!-- ===== MINI MAP ===== -->
  <div id="minimap">
    <canvas id="minimap-canvas"></canvas>
  </div>

  <!-- ===== PROVINCE PANEL ===== -->
  <div id="provincePanel" class="province-panel">
    <div class="flex justify-between items-start mb-3">
      <div>
        <h3 id="province-name" class="font-bold text-lg text-amber-300">Tên tỉnh</h3>
        <p class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
          <span>Chủ sở hữu:</span>
          <span id="province-owner" class="font-semibold text-slate-200">---</span>
        </p>
      </div>
      <button id="closePanelBtn" class="text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-4 text-sm">
      <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
        <div class="text-slate-400 text-[10px] uppercase tracking-wide">Quân đội</div>
        <div id="province-troops" class="font-bold text-slate-100 text-lg">0</div>
      </div>
      <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
        <div class="text-slate-400 text-[10px] uppercase tracking-wide">Kinh tế</div>
        <div id="province-economy" class="font-bold text-slate-100 text-lg">0</div>
      </div>
    </div>

    <div id="province-actions" class="flex flex-col gap-2">
      <button id="btn-recruit" class="btn-primary w-full justify-center text-sm">
        <i class="fa-solid fa-user-plus"></i> Tuyển quân
      </button>
      <button id="btn-develop" class="btn-secondary w-full justify-center text-sm">
        <i class="fa-solid fa-chart-line"></i> Phát triển kinh tế
      </button>
      <button id="btn-attack" class="btn-danger w-full justify-center text-sm">
        <i class="fa-solid fa-swords"></i> Tấn công
      </button>
    </div>
    <div id="attack-target-hint" class="hidden mt-2 p-2 bg-rose-950/50 border border-rose-800/50 rounded-lg text-xs text-rose-200 text-center">
      <i class="fa-solid fa-circle-info mr-1"></i> Chọn tỉnh mục tiêu để tấn công
    </div>
  </div>

  <!-- ===== SETUP MODAL ===== -->
  <div id="setupModal" class="modal-overlay active">
    <div class="modal-box">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-amber-500 to-amber-300 text-slate-950 rounded-2xl text-3xl font-black mb-3 shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-crown"></i>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-100">
          AGE OF STRATEGY
        </h1>
        <p class="text-sm text-slate-400 mt-1">Multiplayer - Chinh phục Châu Âu</p>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          <i class="fa-solid fa-user-shield text-amber-400 mr-1"></i> Tên lãnh tụ
        </label>
        <input type="text" id="playerNameInput" value="Napoleon" placeholder="Nhập tên của bạn..." class="w-full bg-slate-800/80 border border-slate-700 focus:border-amber-400 rounded-xl px-4 py-3 text-slate-100 font-medium outline-none transition text-sm">
      </div>

      <div class="mb-6">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          <i class="fa-solid fa-flag text-amber-400 mr-1"></i> Chọn quốc gia
        </label>
        <div id="country-list" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-60 overflow-y-auto pr-1">
          <!-- JS sẽ render -->
        </div>
      </div>

      <div class="flex flex-col gap-3">
        <button id="btn-create-game" class="btn-primary w-full justify-center text-base py-3" disabled>
          <i class="fa-solid fa-plus"></i> Tạo phòng mới
        </button>
        <div class="flex gap-2">
          <input type="text" id="gameIdInput" placeholder="Nhập mã phòng..." class="flex-1 bg-slate-800/80 border border-slate-700 focus:border-amber-400 rounded-xl px-4 py-3 text-slate-100 font-medium outline-none transition text-sm">
          <button id="btn-join-game" class="btn-secondary px-6" disabled>
            <i class="fa-solid fa-right-to-bracket"></i> Tham gia
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== LOBBY MODAL ===== -->
  <div id="lobbyModal" class="modal-overlay">
    <div class="modal-box">
      <div id="lobbyContent">
        <!-- JS sẽ render -->
      </div>
    </div>
  </div>

  <!-- ===== DIPLOMACY MODAL ===== -->
  <div id="diplomacyModal" class="modal-overlay">
    <div class="modal-box">
      <div id="diplomacyContent">
        <!-- JS sẽ render -->
      </div>
    </div>
  </div>

  <!-- ===== TECH MODAL ===== -->
  <div id="techModal" class="modal-overlay">
    <div class="modal-box">
      <div id="techContent">
        <!-- JS sẽ render -->
      </div>
    </div>
  </div>

  <!-- ===== RECRUIT MODAL ===== -->
  <div id="recruitModal" class="modal-overlay">
    <div class="modal-box">
      <div id="recruitContent">
        <!-- JS sẽ render -->
      </div>
    </div>
  </div>

  <!-- ===== PEACE MODAL ===== -->
  <div id="peaceModal" class="modal-overlay">
    <div class="modal-box">
      <div id="peaceContent">
        <!-- JS sẽ render -->
      </div>
    </div>
  </div>

  <!-- ===== GAME.JS ===== -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
  </script>
  <script type="module">
    // ============================================================
    // IMPORT GAME.JS TỪ RAW LINK
    // ============================================================
    const gameModule = await import('https://raw.githubusercontent.com/worldoftankblizt1234-wq/Json/refs/heads/main/game.js');

    // ============================================================
    // KẾT NỐI CÁC HÀM TỪ GAME.JS VÀO WINDOW
    // ============================================================
    window.loginWithNickname = gameModule.loginWithNickname;
    window.createGame = gameModule.createGame;
    window.joinGame = gameModule.joinGame;
    window.toggleReady = gameModule.toggleReady;
    window.startGame = gameModule.startGame;
    window.leaveGame = gameModule.leaveGame;
    window.showDiplomacy = gameModule.showDiplomacy;
    window.showTechTree = gameModule.showTechTree;
    window.showRecruitMenu = gameModule.showRecruitMenu;
    window.recruitUnits = gameModule.recruitUnits;
    window.researchTech = gameModule.researchTech;
    window.declareWar = gameModule.declareWar;
    window.formAlliance = gameModule.formAlliance;
    window.breakAlliance = gameModule.breakAlliance;
    window.tradeAgreement = gameModule.tradeAgreement;
    window.cancelTrade = gameModule.cancelTrade;
    window.imposeSanctions = gameModule.imposeSanctions;
    window.peaceNegotiation = gameModule.peaceNegotiation;
    window.proposePeace = gameModule.proposePeace;
    window.acceptPeace = gameModule.acceptPeace;
    window.closeModal = gameModule.closeModal;

    // ============================================================
    // KHỞI TẠO UI SAU KHI IMPORT
    // ============================================================
    const { COUNTRIES, GameData, CONFIG } = gameModule;

    // Render danh sách quốc gia
    function renderCountryList() {
      const container = document.getElementById('country-list');
      container.innerHTML = '';

      Object.entries(COUNTRIES).forEach(([code, country]) => {
        const card = document.createElement('div');
        card.className = 'country-card';
        card.dataset.country = code;

        const isSelected = GameData.selectedCountries?.includes(code);
        if (isSelected) card.classList.add('disabled');

        card.innerHTML = `
          <span class="flag-dot" style="background:${country.color}"></span>
          <div class="flex-1">
            <div class="font-semibold text-sm">${country.name}</div>
            <div class="text-xs text-slate-400">${country.regions || 0} tỉnh</div>
          </div>
          ${isSelected ? '<i class="fa-solid fa-lock text-slate-500"></i>' : '<i class="fa-regular fa-circle-check text-slate-600"></i>'}
        `;

        if (!isSelected) {
          card.addEventListener('click', () => {
            document.querySelectorAll('.country-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            document.getElementById('btn-create-game').disabled = false;
            document.getElementById('btn-join-game').disabled = false;
          });
        }

        container.appendChild(card);
      });
    }

    // Setup events
    function setupUIEvents() {
      // Đăng nhập
      document.getElementById('playerNameInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          window.loginWithNickname(e.target.value);
        }
      });

      // Tạo phòng
      document.getElementById('btn-create-game').addEventListener('click', () => {
        const selected = document.querySelector('.country-card.selected');
        if (!selected) return;
        const country = selected.dataset.country;
        // Set vào GameData để game.js biết
        GameData.gameState.currentCountry = country;
        window.createGame();
      });

      // Tham gia phòng
      document.getElementById('btn-join-game').addEventListener('click', () => {
        const selected = document.querySelector('.country-card.selected');
        if (!selected) return;
        const country = selected.dataset.country;
        GameData.gameState.currentCountry = country;
        const gameId = document.getElementById('gameIdInput').value.trim();
        if (!gameId) {
          alert('Vui lòng nhập mã phòng!');
          return;
        }
        window.joinGame(gameId);
      });

      // Đóng panel
      document.getElementById('closePanelBtn').addEventListener('click', () => {
        document.getElementById('provincePanel').classList.remove('open');
      });

      // Nút tuyển quân
      document.getElementById('btn-recruit').addEventListener('click', () => {
        const provinceId = GameData.gameState.selectedProvince;
        if (provinceId) window.showRecruitMenu(provinceId);
      });

      // Nút phát triển kinh tế
      document.getElementById('btn-develop').addEventListener('click', () => {
        // Gọi hàm từ game.js nếu có
        if (window.developEconomy) {
          window.developEconomy(GameData.gameState.selectedProvince);
        } else {
          alert('Chức năng đang phát triển');
        }
      });

      // Nút tấn công
      document.getElementById('btn-attack').addEventListener('click', () => {
        const hint = document.getElementById('attack-target-hint');
        hint.classList.toggle('hidden');
        // Kích hoạt chế độ chọn mục tiêu
        GameData.gameState.isAttackMode = !GameData.gameState.isAttackMode;
        document.getElementById('btn-attack').classList.toggle('btn-danger');
        document.getElementById('btn-attack').classList.toggle('btn-primary');
        if (GameData.gameState.isAttackMode) {
          document.getElementById('btn-attack').innerHTML = '<i class="fa-solid fa-ban"></i> Hủy tấn công';
        } else {
          document.getElementById('btn-attack').innerHTML = '<i class="fa-solid fa-swords"></i> Tấn công';
        }
      });
    }

    // Lắng nghe cập nhật GameData để hiển thị province panel
    function watchProvinceSelection() {
      // Override selectProvince từ game.js để mở panel
      const originalSelect = window.selectProvince;
      window.selectProvince = function(provinceId) {
        const province = GameData.provinces[provinceId];
        if (!province) return;

        GameData.gameState.selectedProvince = provinceId;
        const panel = document.getElementById('provincePanel');
        document.getElementById('province-name').textContent = province.name || 'Không tên';
        document.getElementById('province-owner').textContent = COUNTRIES[province.country]?.name || province.country;
        document.getElementById('province-troops').textContent = Object.values(province.units || {}).reduce((a,b) => a+b, 0);
        document.getElementById('province-economy').textContent = province.economy || 0;
        panel.classList.add('open');

        // Ẩn/hiện nút hành động dựa trên chủ sở hữu
        const isMine = province.country === GameData.gameState.currentCountry;
        document.getElementById('province-actions').style.display = isMine ? 'flex' : 'none';
      };
    }

    // Mini map
    function initMiniMap() {
      const canvas = document.getElementById('minimap-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 150;
      canvas.height = 150;

      function updateMiniMap() {
        ctx.clearRect(0, 0, 150, 150);
        ctx.fillStyle = '#1a3a5a';
        ctx.fillRect(0, 0, 150, 150);

        const provinces = GameData.provinces || {};
        Object.values(provinces).forEach(p => {
          const x = (p.x / CONFIG.MAP_SIZE.width) * 150;
          const y = (p.y / CONFIG.MAP_SIZE.height) * 150;
          const color = COUNTRIES[p.country]?.color || '#666';
          ctx.fillStyle = color;
          ctx.fillRect(x - 1, y - 1, 3, 3);
        });

        requestAnimationFrame(updateMiniMap);
      }
      updateMiniMap();
    }

    // Notification system
    window.notify = function(message, type = 'info') {
      const container = document.getElementById('notification-container');
      const colors = {
        info: 'info',
        success: 'success',
        warning: 'warning',
        danger: 'danger'
      };
      const div = document.createElement('div');
      div.className = `notification ${colors[type] || 'info'}`;
      div.innerHTML = `<span>${message}</span>`;
      container.appendChild(div);

      setTimeout(() => {
        div.classList.add('fade-out');
        setTimeout(() => div.remove(), 500);
      }, 4000);
    };

    // Khởi tạo
    renderCountryList();
    setupUIEvents();
    watchProvinceSelection();
    initMiniMap();

    console.log('✅ Index.html đã sẵn sàng với game.js từ raw link!');
    console.log('📦 Quốc gia:', Object.keys(COUNTRIES).length);
    console.log('🗺️ Tỉnh:', Object.keys(GameData.provinces || {}).length);

    // Ẩn loading sau 1s
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
    }, 1000);
  </script>

</body>
</html>
