<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Birthday RTS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a1a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        #app {
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 220px;
            background: #1a1a2e;
            padding: 15px;
            border-right: 2px solid #e94560;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        #sidebar h2 {
            color: #e94560;
            font-size: 18px;
            text-align: center;
        }
        #player-info {
            background: #0f3460;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        #player-info .label { color: #888; }
        #player-info .value { color: #ffd700; font-weight: bold; }
        #player-list {
            flex: 1;
            overflow-y: auto;
            background: #0f3460;
            padding: 10px;
            border-radius: 8px;
        }
        .player-item {
            padding: 5px 8px;
            border-left: 3px solid;
            margin-bottom: 3px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }
        #chat-container {
            background: #0f3460;
            border-radius: 8px;
            padding: 8px;
            height: 150px;
            display: flex;
            flex-direction: column;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            font-size: 12px;
            padding: 5px;
        }
        .chat-message {
            padding: 2px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        #chat-input-row {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        #chat-input {
            flex: 1;
            padding: 5px 8px;
            border-radius: 4px;
            border: none;
            background: #1a1a2e;
            color: #fff;
        }
        #chat-input:focus { outline: 1px solid #e94560; }
        #chat-send {
            padding: 5px 12px;
            background: #e94560;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
        }
        #map-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a1a;
        }
        #gameCanvas {
            max-width: 100%;
            max-height: 100vh;
            cursor: pointer;
            border: 2px solid #e94560;
            border-radius: 4px;
        }
        #info-panel {
            width: 220px;
            background: #1a1a2e;
            padding: 15px;
            border-left: 2px solid #e94560;
            overflow-y: auto;
        }
        #info-panel h3 {
            color: #e94560;
            font-size: 16px;
            margin-bottom: 10px;
        }
        #info-content {
            background: #0f3460;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.8;
            min-height: 200px;
        }
        #connection-status {
            text-align: center;
            font-size: 12px;
            padding: 4px;
            background: #0a0a1a;
            border-radius: 4px;
        }
        #player-name-input {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }
        #player-name {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            border: none;
            background: #0a0a1a;
            color: #fff;
        }
        #join-btn {
            padding: 4px 12px;
            background: #4ade80;
            border: none;
            border-radius: 4px;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #e94560; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar">
            <h2>🎂 Birthday RTS</h2>
            <div id="connection-status">🟡 Đang kết nối...</div>
            
            <div id="player-name-input">
                <input id="player-name" placeholder="Tên của bạn" value="Chiến Binh">
                <button id="join-btn" onclick="location.reload()">🔄</button>
            </div>
            
            <div id="player-info">
                <div id="player-name-display" style="color:#ffd700;font-weight:bold;">👑 Chưa đăng nhập</div>
                <div><span class="label">💰 Vàng:</span> <span class="value" id="gold-display">0</span></div>
                <div><span class="label">🏙️ Thành phố:</span> <span class="value" id="city-count">0</span></div>
                <div><span class="label">⚔️ Quân đội:</span> <span class="value" id="army-display">0</span></div>
            </div>
            
            <div id="player-list">
                <div style="color:#888;font-size:12px;text-align:center;">👥 Danh sách người chơi</div>
            </div>
            
            <div id="chat-container">
                <div id="chat-messages"></div>
                <div id="chat-input-row">
                    <input id="chat-input" placeholder="Chat...">
                    <button id="chat-send" onclick="sendChatMessage()">Gửi</button>
                </div>
            </div>
        </div>
        
        <!-- Bản đồ -->
        <div id="map-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <!-- Info Panel -->
        <div id="info-panel">
            <h3>📌 Thông tin</h3>
            <div id="info-content">
                <p style="color:#888;">Click vào thành phố để xem</p>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
