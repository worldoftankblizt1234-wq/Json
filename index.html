<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🌍 Age of History - Multiplayer</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- ====== CẢNH BÁO XOAY NGANG ====== -->
    <div id="rotate-warning" class="fixed inset-0 z-[100] bg-gray-950/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
        <div class="w-20 h-20 mb-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-4xl animate-bounce">📱</div>
        <h2 class="text-lg font-bold text-indigo-400 mb-2">VUI LÒNG XOAY NGANG ĐIỆN THOẠI</h2>
        <p class="text-sm text-gray-400 max-w-xs">Xoay ngang màn hình để trải nghiệm game tốt nhất</p>
        <div class="mt-6 text-6xl animate-pulse">↻</div>
    </div>

    <!-- ====== CANVAS BẢN ĐỒ ====== -->
    <canvas id="worldMapCanvas"></canvas>

    <!-- ====== MINI MAP ====== -->
    <div id="mini-map-container">
        <div class="text-[8px] text-gray-400 font-bold text-center mb-0.5">🗺️</div>
        <canvas id="miniMapCanvas" width="180" height="100"></canvas>
    </div>

    <!-- ====== TOP BAR ====== -->
    <div id="top-bar" class="fixed top-0 left-0 right-0 z-40 bg-gray-900/95 backdrop-blur-md border-b border-indigo-500/20 px-2 py-1 flex flex-wrap items-center justify-between gap-0.5 relative">
        <div class="flex items-center gap-1.5 text-[9px] sm:text-xs">
            <span class="text-yellow-400 font-bold">💰 <span id="gold-display">0</span></span>
            <span class="text-blue-400 font-bold">👤 <span id="pop-display">0</span></span>
            <span class="text-red-400 font-bold">⚔️ <span id="army-display">0</span></span>
            <span class="text-green-400 font-bold">🏗️ <span id="building-count">0</span></span>
        </div>
        <div class="flex items-center gap-1.5 text-[9px] sm:text-xs">
            <span class="text-gray-400">⏱️ <span id="time-display">30:00</span></span>
            <span class="text-gray-400">👑 <span id="nation-name-display">Red Empire</span></span>
            <span class="w-3 h-3 rounded-full border border-white/20" id="nation-color-display" style="background:#dc2626"></span>
        </div>
        <div id="time-bar" class="absolute bottom-0 left-0 h-0.5 bg-gradient-to-r from-green-500 via-yellow-500 to-red-500 transition-all duration-300" style="width:100%; transform-origin:left; transform:scaleX(1)"></div>
    </div>

    <!-- ====== GAME CONTROLS ====== -->
    <div id="game-controls" class="fixed bottom-0 left-0 right-0 z-40 bg-gray-900/95 backdrop-blur-md border-t border-indigo-500/30 px-1 py-1">
        <div class="flex flex-wrap gap-0.5 justify-center items-center max-w-4xl mx-auto">
            <button id="btn-select" class="px-1.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-[8px] sm:text-xs font-bold transition active:scale-95">🎯 Chọn</button>
            <button id="btn-move" class="px-1.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-[8px] sm:text-xs font-bold transition active:scale-95">🚀 Di chuyển</button>
            <button id="btn-attack" class="px-1.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-[8px] sm:text-xs font-bold transition active:scale-95">⚔️ Tấn công</button>
            <button id="btn-recruit" class="px-1.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-green-600 hover:bg-green-500 text-white text-[8px] sm:text-xs font-bold transition active:scale-95">🔰 Tuyển</button>
            <button id="btn-build" class="px-1.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white text-[8px] sm:text-xs font-bold transition active:scale-95">🏗️ Xây</button>
            <button id="btn-diplomacy" class="px-1.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-[8px] sm:text-xs font-bold transition active:scale-95">🤝 Ngoại</button>
            <span class="text-gray-600 text-[8px]">|</span>
            <button id="btn-pause" class="px-1.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white text-[8px] sm:text-xs font-bold transition active:scale-95">⏸️</button>
            <button id="btn-speed" class="px-1.5 py-1 sm:px-3 sm:py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white text-[8px] sm:text-xs font-bold transition active:scale-95">⏩ 1x</button>
        </div>
    </div>

    <!-- ====== MODALS ====== -->
    <div id="province-modal" class="hidden fixed top-10 left-1 z-50 w-56 max-h-[60vh] overflow-y-auto bg-gray-900/95 backdrop-blur-md border border-indigo-500/40 rounded-2xl p-2.5 shadow-2xl text-[10px]">
        <button id="btn-close-modal" class="absolute top-1 right-2 text-gray-400 hover:text-white text-sm">✕</button>
        <div id="modal-content"></div>
    </div>

    <div id="build-menu" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 bg-gray-900/95 backdrop-blur-md border border-purple-500/40 rounded-2xl p-3 w-72 max-h-[70vh] overflow-y-auto shadow-2xl">
        <h3 class="text-white font-bold text-sm mb-2">🏗️ XÂY DỰNG</h3>
        <div id="build-list" class="space-y-1"></div>
        <button id="btn-close-build" class="mt-2 px-4 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white text-xs w-full">Đóng</button>
    </div>

    <div id="diplomacy-menu" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 bg-gray-900/95 backdrop-blur-md border border-amber-500/40 rounded-2xl p-3 w-72 max-h-[70vh] overflow-y-auto shadow-2xl">
        <h3 class="text-white font-bold text-sm mb-2">🤝 NGOẠI GIAO</h3>
        <div id="diplomacy-list" class="space-y-1"></div>
        <button id="btn-close-diplomacy" class="mt-2 px-4 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-white text-xs w-full">Đóng</button>
    </div>

    <div id="nations-list-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-2">
        <div class="bg-gray-900 border border-indigo-500/40 w-full max-w-4xl max-h-[85vh] rounded-2xl p-3 overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-800 pb-1.5 mb-2">
                <h2 class="text-white font-bold text-sm">🏛️ DANH SÁCH QUỐC GIA</h2>
                <button id="btn-close-nations-modal" class="text-gray-400 hover:text-white text-lg">✕</button>
            </div>
            <div id="nations-list-content"></div>
        </div>
    </div>

    <!-- ====== TOAST ====== -->
    <div id="toast-container" class="fixed top-10 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

    <!-- ====== JAVASCRIPT ====== -->
    <script src="js/config.js"></script>
    <script src="js/buildings.js"></script>
    <script src="js/map.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/multiplayer.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
