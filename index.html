<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Age of Strategy - AoH Web Game</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background-color: #0b1329;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #map-viewport {
      width: 100vw;
      height: 100vh;
      cursor: grab;
      overflow: hidden;
      position: relative;
      background: #80b3d5; /* Màu đại dương MapChart */
    }

    #map-viewport:active {
      cursor: grabbing;
    }

    #map-container {
      transform-origin: 0 0;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.05s ease-out;
    }

    /* Style cho các thẻ path trên bản đồ SVG */
    #map-container path {
      stroke: #1e293b;
      stroke-width: 0.7px;
      transition: fill 0.2s, stroke 0.2s, filter 0.2s;
      cursor: pointer;
    }

    #map-container path:hover {
      filter: brightness(1.25);
      stroke: #ffffff;
      stroke-width: 1.5px;
    }

    /* Tỉnh đang chọn */
    #map-container path.selected {
      stroke: #f59e0b !important;
      stroke-width: 2.5px !important;
      filter: brightness(1.3);
    }

    /* Tỉnh mục tiêu tấn công */
    #map-container path.target {
      stroke: #ef4444 !important;
      stroke-width: 2.5px !important;
      animation: pulse-red 1s infinite alternate;
    }

    @keyframes pulse-red {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.6); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 3px;
    }
  </style>
</head>
<body class="text-slate-100 h-screen w-screen relative">

  <!-- ==================== MÀN HÌNH ĐĂNG NHẬP & CHỌN QUỐC GIA ==================== -->
  <div id="setup-screen" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-lg flex items-center justify-center p-4 overflow-y-auto">
    <div class="max-w-2xl w-full bg-slate-900 border border-slate-700/80 rounded-3xl p-6 md:p-8 shadow-2xl my-auto">
      
      <!-- LOGO & TIÊU ĐỀ -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-amber-500 to-amber-300 text-slate-950 rounded-2xl text-3xl font-black mb-3 shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-crown"></i>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-100">
          AGE OF STRATEGY
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">Chinh phục Châu Âu - Game Chiến Thuật Theo Lượt</p>
      </div>

      <!-- FORM ĐĂNG NHẬP THÔNG TIN -->
      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
            <i class="fa-solid fa-user-shield text-amber-400 mr-1.5"></i> Tên Lãnh Tụ / Người Chơi
          </label>
          <input type="text" id="input-player-name" value="Napoleon" placeholder="Nhập tên của bạn..." class="w-full bg-slate-800/80 border border-slate-700 focus:border-amber-400 rounded-xl px-4 py-3 text-slate-100 font-medium outline-none transition text-sm">
        </div>
      </div>

      <!-- DANH SÁCH CHỌN QUỐC GIA -->
      <div class="mb-6">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          <i class="fa-solid fa-flag text-amber-400 mr-1.5"></i> Chọn Quốc Gia Khởi Đầu
        </label>
        
        <div id="country-list" class="grid grid-cols-1 md:grid-cols-2 gap-2.5 max-h-60 overflow-y-auto pr-1">
          <!-- Các thẻ chọn quốc gia sẽ được tạo động bằng JS -->
          <div class="p-4 text-center text-slate-500 text-xs">Đang tải danh sách quốc gia...</div>
        </div>
      </div>

      <!-- NÚT BẮT ĐẦU GAME -->
      <button id="btn-start-game" disabled class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 disabled:opacity-50 disabled:cursor-not-allowed text-slate-950 font-extrabold py-3.5 px-6 rounded-2xl shadow-xl flex items-center justify-center gap-2 border border-amber-300/40 active:scale-98 transition text-base">
        <span>BẮT ĐẦU CHINH PHỤC</span>
        <i class="fa-solid fa-play"></i>
      </button>

    </div>
  </div>


  <!-- ==================== GIAO DIỆN CHÍNH TRONG GAME ==================== -->

  <!-- KHUNG HIỂN THỊ BẢN ĐỒ -->
  <div id="map-viewport">
    <div id="map-container">
      <div id="svg-holder" class="w-full h-full"></div>
    </div>
  </div>

  <!-- BẢNG THÔNG TIN CẤP CAO (TOP BAR) -->
  <div class="fixed top-3 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 rounded-2xl px-4 md:px-6 py-2 shadow-2xl flex items-center gap-3 md:gap-6 z-20 text-xs md:text-sm">
    
    <!-- THÔNG TIN LÃNH TỤ & QUỐC GIA -->
    <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition" id="topbar-profile" title="Xem thông tin người chơi">
      <span class="w-4 h-4 rounded-full border border-white/40 flex-shrink-0" id="player-flag"></span>
      <div class="flex flex-col">
        <span class="font-bold text-amber-400 leading-none" id="player-country-display">Đang tải...</span>
        <span class="text-[10px] text-slate-400 mt-0.5 leading-none" id="player-name-display">Lãnh tụ</span>
      </div>
    </div>

    <div class="h-5 w-px bg-slate-700"></div>

    <!-- VÀNG & THU NHẬP -->
    <div class="flex items-center gap-1.5" title="Ngân sách quốc gia">
      <i class="fa-solid fa-coins text-yellow-400"></i>
      <span class="font-semibold text-emerald-400" id="player-gold">0</span>
      <span class="text-[11px] text-slate-400" id="player-income">(+0)</span>
    </div>

    <div class="h-5 w-px bg-slate-700"></div>

    <!-- TỔNG QUÂN SỐ -->
    <div class="flex items-center gap-1.5" title="Tổng lực lượng quân sự">
      <i class="fa-solid fa-shield-halved text-blue-400"></i>
      <span class="font-semibold text-blue-300" id="player-total-troops">0</span>
    </div>

    <div class="h-5 w-px bg-slate-700"></div>

    <!-- LƯỢT CHƠI -->
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-hourglass-half text-amber-300"></i>
      <span>Lượt: <strong id="current-turn" class="text-amber-300">1</strong></span>
    </div>
  </div>

  <!-- NÚT ZOOM & ĐỔI QUỐC GIA -->
  <div class="fixed top-20 right-4 flex flex-col gap-2 z-20">
    <button id="btn-zoom-in" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 border border-slate-600 rounded-xl flex items-center justify-center text-lg shadow-lg active:scale-95 transition" title="Phóng to">
      <i class="fa-solid fa-plus"></i>
    </button>
    <button id="btn-zoom-out" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 border border-slate-600 rounded-xl flex items-center justify-center text-lg shadow-lg active:scale-95 transition" title="Thu nhỏ">
      <i class="fa-solid fa-minus"></i>
    </button>
    <button id="btn-reset-view" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 border border-slate-600 rounded-xl flex items-center justify-center text-base shadow-lg active:scale-95 transition" title="Đặt lại vị trí">
      <i class="fa-solid fa-crosshairs"></i>
    </button>
    <button id="btn-change-country" class="w-10 h-10 bg-amber-600/90 hover:bg-amber-500 text-slate-950 border border-amber-400 rounded-xl flex items-center justify-center text-base shadow-lg active:scale-95 transition mt-2" title="Đổi quốc gia / Chơi lại">
      <i class="fa-solid fa-arrow-rotate-left"></i>
    </button>
  </div>

  <!-- NÚT KẾT THÚC LƯỢT -->
  <button id="btn-end-turn" class="fixed bottom-6 right-6 z-20 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold px-5 py-3.5 md:px-6 md:py-4 rounded-2xl shadow-xl flex items-center gap-3 border border-amber-300/50 active:scale-95 transition text-sm md:text-base">
    <span>KẾT THÚC LƯỢT</span>
    <i class="fa-solid fa-forward"></i>
  </button>

  <!-- BẢNG TƯƠNG TÁC TỈNH (SIDEBAR MENU) -->
  <div id="province-panel" class="fixed bottom-6 left-6 z-20 w-80 md:w-96 bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-2xl p-5 shadow-2xl transition-all duration-300 transform translate-y-full opacity-0 pointer-events-none">
    <div class="flex justify-between items-start mb-3">
      <div>
        <h3 id="prov-title" class="font-bold text-lg text-amber-300">Tên Tỉnh</h3>
        <p class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
          <span>Chủ sở hữu:</span>
          <span id="prov-owner" class="font-semibold text-slate-200">Không rõ</span>
        </p>
      </div>
      <button id="btn-close-panel" class="text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- CHỈ SỐ TỈNH -->
    <div class="grid grid-cols-2 gap-2 mb-4 text-xs md:text-sm">
      <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50 flex items-center gap-2.5">
        <i class="fa-solid fa-person-military-rifle text-blue-400 text-base"></i>
        <div>
          <div class="text-slate-400 text-[10px]">Quân đội</div>
          <div id="prov-troops" class="font-bold text-slate-100">0</div>
        </div>
      </div>
      <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50 flex items-center gap-2.5">
        <i class="fa-solid fa-chart-line text-emerald-400 text-base"></i>
        <div>
          <div class="text-slate-400 text-[10px]">Kinh tế</div>
          <div id="prov-economy" class="font-bold text-slate-100">0</div>
        </div>
      </div>
    </div>

    <!-- CÁC HÀNH ĐỘNG DÀNH CHO TỈNH NÀY -->
    <div id="prov-actions" class="flex flex-col gap-2">
      <button id="btn-action-recruit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-between text-sm transition active:scale-98">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-user-plus"></i> Tuyển quân (+10)
        </span>
        <span class="text-xs bg-blue-800/80 px-2 py-0.5 rounded-md text-blue-200">50 💰</span>
      </button>

      <button id="btn-action-develop" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-between text-sm transition active:scale-98">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-building-circle-arrow-right"></i> Phát triển kinh tế (+5)
        </span>
        <span class="text-xs bg-emerald-800/80 px-2 py-0.5 rounded-md text-emerald-200">100 💰</span>
      </button>

      <button id="btn-action-attack" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-between text-sm transition active:scale-98">
        <span class="flex items-center gap-2">
          <i class="fa-solid fa-swords"></i> Tấn công / Di chuyển
        </span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <div id="prov-target-info" class="hidden bg-rose-950/40 border border-rose-800/50 rounded-xl p-3 text-xs text-rose-200 mt-2">
      <i class="fa-solid fa-circle-info mr-1"></i> Bấm chọn tỉnh mục tiêu để xuất quân!
    </div>
  </div>

  <!-- MODAL THÔNG BÁO -->
  <div id="game-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center transform scale-95 transition-transform duration-300" id="modal-box">
      <div id="modal-icon" class="text-4xl text-amber-400 mb-3">
        <i class="fa-solid fa-crown"></i>
      </div>
      <h2 id="modal-title" class="text-xl font-bold text-slate-100 mb-2">Thông báo</h2>
      <p id="modal-body" class="text-sm text-slate-300 mb-6">Nội dung thông báo...</p>
      <button id="modal-close" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl transition">
        Xác nhận
      </button>
    </div>
  </div>

  <!-- LOGIC GAME ENGINE -->
  <script>
    // --- 1. DỮ LIỆU CẤU HÌNH BAN ĐẦU ---
    const GAME_CONFIG = {
      svgPath: 'MapChart_Map.svg',
      jsonPath: 'mapchartSave__europe_detailed__.txt',
      defaultGold: 300,
      recruitCost: 50,
      recruitAmount: 10,
      developCost: 100,
      developAmount: 5
    };

    // Tên quốc gia dịch chuẩn tiếng Việt tương ứng với mã màu MapChart
    const COLOR_TO_COUNTRY = {
      '#8dd3c7': { name: 'Vương Quốc Anh', code: 'UK' },
      '#999999': { name: 'Đức', code: 'DE' },
      '#225ea8': { name: 'Pháp', code: 'FR' },
      '#fb8072': { name: 'Ukraine', code: 'UA' },
      '#diagonal3_3264c8_ffffff': { name: 'Tây Ban Nha', code: 'ES' },
      '#fc4e2a': { name: 'Ý', code: 'IT' },
      '#4daf4a': { name: 'Đan Mạch', code: 'DK' },
      '#fdd49e': { name: 'Áo', code: 'AT' },
      '#circles3_a03500_000000': { name: 'Bỉ & Bosnia', code: 'BE' },
      '#cc3333': { name: 'Estonia', code: 'EE' },
      '#a6cee3': { name: 'Hy Lạp', code: 'GR' },
      '#decbe4': { name: 'Thụy Sĩ & Bắc Âu', code: 'SE' },
      '#d73027': { name: 'Nga', code: 'RU' }
    };

    let gameState = {
      turn: 1,
      playerName: 'Napoleon',
      playerCountry: null,
      countries: {},
      provinces: {},
      selectedProvinceId: null,
      targetProvinceId: null,
      isAttackMode: false
    };

    let mapDataRaw = null;

    // --- 2. QUẢN LÝ PAN & ZOOM BẢN ĐỒ ---
    let zoomState = {
      scale: 1,
      panning: false,
      pointX: 0,
      pointY: 0,
      startX: 0,
      startY: 0
    };

    const viewport = document.getElementById('map-viewport');
    const container = document.getElementById('map-container');

    function updateTransform() {
      container.style.transform = `translate(${zoomState.pointX}px, ${zoomState.pointY}px) scale(${zoomState.scale})`;
    }

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('#province-panel') || e.target.closest('button')) return;
      zoomState.panning = true;
      zoomState.startX = e.clientX - zoomState.pointX;
      zoomState.startY = e.clientY - zoomState.pointY;
    });

    window.addEventListener('mouseup', () => { zoomState.panning = false; });
    
    window.addEventListener('mousemove', (e) => {
      if (!zoomState.panning) return;
      zoomState.pointX = e.clientX - zoomState.startX;
      zoomState.pointY = e.clientY - zoomState.startY;
      updateTransform();
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const xs = (e.clientX - zoomState.pointX) / zoomState.scale;
      const ys = (e.clientY - zoomState.pointY) / zoomState.scale;
      const delta = -e.deltaY;
      
      (delta > 0) ? (zoomState.scale *= 1.15) : (zoomState.scale /= 1.15);
      zoomState.scale = Math.min(Math.max(0.4, zoomState.scale), 8);

      zoomState.pointX = e.clientX - xs * zoomState.scale;
      zoomState.pointY = e.clientY - ys * zoomState.scale;
      updateTransform();
    }, { passive: false });

    document.getElementById('btn-zoom-in').onclick = () => {
      zoomState.scale = Math.min(zoomState.scale * 1.25, 8);
      updateTransform();
    };
    document.getElementById('btn-zoom-out').onclick = () => {
      zoomState.scale = Math.max(zoomState.scale / 1.25, 0.4);
      updateTransform();
    };
    document.getElementById('btn-reset-view').onclick = () => {
      zoomState.scale = 1;
      zoomState.pointX = 0;
      zoomState.pointY = 0;
      updateTransform();
    };

    // --- 3. KHỞI TẠO GAME VÀ NẠP FILE MAP ---
    window.addEventListener('DOMContentLoaded', async () => {
      await loadMapData();
      initUIEvents();
    });

    async function loadMapData() {
      try {
        const [svgRes, jsonRes] = await Promise.all([
          fetch(GAME_CONFIG.svgPath).catch(() => null),
          fetch(GAME_CONFIG.jsonPath).catch(() => null)
        ]);

        if (svgRes && svgRes.ok) {
          const svgText = await svgRes.text();
          document.getElementById('svg-holder').innerHTML = svgText;
        } else {
          showModal("Thiếu File", "Không tìm thấy file MapChart_Map.svg trong thư mục!");
          return;
        }

        if (jsonRes && jsonRes.ok) {
          mapDataRaw = await jsonRes.json();
        }

        buildGameStateFromMap();
        renderCountrySelectionList();
        bindProvinceClickEvents();

      } catch (err) {
        console.error("Lỗi nạp dữ liệu:", err);
      }
    }

    // Phân tích dữ liệu tỉnh thành từ JSON/SVG
    function buildGameStateFromMap() {
      gameState.countries = {};
      gameState.provinces = {};

      if (mapDataRaw && mapDataRaw.groups) {
        for (const [color, group] of Object.entries(mapDataRaw.groups)) {
          const countryMeta = COLOR_TO_COUNTRY[color] || { name: `Quốc gia (${color})`, code: 'EU' };
          const cName = countryMeta.name;

          if (!gameState.countries[cName]) {
            gameState.countries[cName] = {
              name: cName,
              color: color.includes('diagonal') || color.includes('circles') ? '#475569' : color,
              gold: GAME_CONFIG.defaultGold,
              provinceCount: 0
            };
          }

          group.paths.forEach(provId => {
            gameState.provinces[provId] = {
              id: provId,
              owner: cName,
              troops: Math.floor(Math.random() * 25) + 10,
              economy: Math.floor(Math.random() * 15) + 10
            };
            gameState.countries[cName].provinceCount++;
          });
        }
      }

      // Xử lý các tỉnh trên SVG chưa nằm trong JSON
      document.querySelectorAll('#svg-holder path').forEach(p => {
        const id = p.getAttribute('id') || p.getAttribute('data-name');
        if (id && !gameState.provinces[id]) {
          const defaultColor = p.getAttribute('fill') || '#f0f0f0';
          const meta = COLOR_TO_COUNTRY[defaultColor] || { name: 'Trung Lập', code: 'NL' };
          const owner = meta.name;

          if (!gameState.countries[owner]) {
            gameState.countries[owner] = {
              name: owner,
              color: defaultColor.startsWith('#') ? defaultColor : '#64748b',
              gold: GAME_CONFIG.defaultGold,
              provinceCount: 0
            };
          }

          gameState.provinces[id] = {
            id: id,
            owner: owner,
            troops: 10,
            economy: 10
          };
          gameState.countries[owner].provinceCount++;
        }
      });
    }

    // Render danh sách chọn quốc gia ở màn hình Setup
    function renderCountrySelectionList() {
      const container = document.getElementById('country-list');
      container.innerHTML = '';

      const countries = Object.values(gameState.countries);
      
      if (countries.length === 0) {
        container.innerHTML = `<div class="p-4 text-center text-rose-400 text-xs">Lỗi: Không tìm thấy danh sách quốc gia. Hãy kiểm tra file SVG/TXT.</div>`;
        return;
      }

      countries.forEach((country) => {
        const item = document.createElement('div');
        item.className = `p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl cursor-pointer flex items-center justify-between transition country-option`;
        item.dataset.country = country.name;

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-4 h-4 rounded-full border border-white/40 flex-shrink-0" style="background-color: ${country.color}"></span>
            <div>
              <div class="font-bold text-sm text-slate-100">${country.name}</div>
              <div class="text-[10px] text-slate-400">${country.provinceCount} tỉnh thành</div>
            </div>
          </div>
          <i class="fa-solid fa-circle-check text-amber-400 opacity-0 check-icon"></i>
        `;

        item.onclick = () => selectStartingCountry(country.name, item);
        container.appendChild(item);
      });
    }

    function selectStartingCountry(countryName, element) {
      gameState.playerCountry = countryName;

      document.querySelectorAll('.country-option').forEach(opt => {
        opt.classList.remove('border-amber-400', 'bg-slate-700/90');
        opt.querySelector('.check-icon').classList.add('opacity-0');
      });

      element.classList.add('border-amber-400', 'bg-slate-700/90');
      element.querySelector('.check-icon').classList.remove('opacity-0');

      document.getElementById('btn-start-game').removeAttribute('disabled');
    }

    // --- 4. BẮT ĐẦU GAME & GIAO DIỆN ---
    function startGame() {
      const pNameInput = document.getElementById('input-player-name').value.trim();
      if (pNameInput) gameState.playerName = pNameInput;

      // Ẩn màn hình chọn
      document.getElementById('setup-screen').classList.add('hidden');

      renderMapColors();
      updateTopBarUI();

      showModal("Bắt đầu màn chơi!", `Chào mừng Lãnh tụ ${gameState.playerName}! Bạn đã tiếp quản quốc gia ${gameState.playerCountry}. Hãy mở rộng bờ cõi và chinh phục Châu Âu!`);
    }

    function renderMapColors() {
      Object.values(gameState.provinces).forEach(prov => {
        const elem = document.getElementById(prov.id);
        if (elem) {
          const country = gameState.countries[prov.owner];
          if (country) {
            elem.setAttribute('fill', country.color);
          }
        }
      });
    }

    function bindProvinceClickEvents() {
      document.querySelectorAll('#svg-holder path').forEach(path => {
        path.addEventListener('click', (e) => {
          e.stopPropagation();
          const provId = path.getAttribute('id') || path.getAttribute('data-name');
          if (provId) {
            onProvinceSelect(provId);
          }
        });
      });

      viewport.addEventListener('click', () => {
        clearSelection();
      });
    }

    // --- 5. TƯƠNG TÁC CHỌN TỈNH ---
    function onProvinceSelect(provId) {
      const provData = gameState.provinces[provId];
      if (!provData) return;

      // Đang ở chế độ tấn công
      if (gameState.isAttackMode) {
        if (provId === gameState.selectedProvinceId) return;
        
        gameState.targetProvinceId = provId;
        highlightProvince(provId, 'target');
        executeAttackOrMove(gameState.selectedProvinceId, gameState.targetProvinceId);
        return;
      }

      gameState.selectedProvinceId = provId;
      highlightProvince(provId, 'selected');
      openProvincePanel(provData);
    }

    function highlightProvince(provId, className) {
      document.querySelectorAll('#svg-holder path').forEach(p => {
        if (className === 'selected') p.classList.remove('selected', 'target');
      });

      const elem = document.getElementById(provId);
      if (elem) {
        elem.classList.add(className);
      }
    }

    function clearSelection() {
      gameState.selectedProvinceId = null;
      gameState.targetProvinceId = null;
      gameState.isAttackMode = false;

      document.querySelectorAll('#svg-holder path').forEach(p => {
        p.classList.remove('selected', 'target');
      });

      closeProvincePanel();
    }

    function openProvincePanel(prov) {
      const panel = document.getElementById('province-panel');
      const isMine = (prov.owner === gameState.playerCountry);

      document.getElementById('prov-title').innerText = prov.id.replace(/_/g, ' ');
      document.getElementById('prov-owner').innerText = prov.owner;
      document.getElementById('prov-troops').innerText = prov.troops;
      document.getElementById('prov-economy').innerText = prov.economy;

      const actionsDiv = document.getElementById('prov-actions');
      const targetInfo = document.getElementById('prov-target-info');

      targetInfo.classList.add('hidden');

      if (isMine) {
        actionsDiv.classList.remove('hidden');
      } else {
        actionsDiv.classList.add('hidden');
      }

      panel.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
    }

    function closeProvincePanel() {
      const panel = document.getElementById('province-panel');
      panel.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
    }

    // --- 6. XỬ LÝ HÀNH ĐỘNG GAME ---
    function initUIEvents() {
      document.getElementById('btn-start-game').onclick = startGame;

      document.getElementById('btn-close-panel').onclick = clearSelection;

      // Đổi quốc gia / Chơi lại
      document.getElementById('btn-change-country').onclick = () => {
        document.getElementById('setup-screen').classList.remove('hidden');
      };

      // Tuyển quân
      document.getElementById('btn-action-recruit').onclick = () => {
        const prov = gameState.provinces[gameState.selectedProvinceId];
        const country = gameState.countries[gameState.playerCountry];

        if (!prov || !country) return;

        if (country.gold >= GAME_CONFIG.recruitCost) {
          country.gold -= GAME_CONFIG.recruitCost;
          prov.troops += GAME_CONFIG.recruitAmount;

          document.getElementById('prov-troops').innerText = prov.troops;
          updateTopBarUI();
        } else {
          showModal("Thiếu Ngân Sách", "Bạn cần ít nhất 50 vàng để tuyển quân!");
        }
      };

      // Phát triển kinh tế
      document.getElementById('btn-action-develop').onclick = () => {
        const prov = gameState.provinces[gameState.selectedProvinceId];
        const country = gameState.countries[gameState.playerCountry];

        if (!prov || !country) return;

        if (country.gold >= GAME_CONFIG.developCost) {
          country.gold -= GAME_CONFIG.developCost;
          prov.economy += GAME_CONFIG.developAmount;

          document.getElementById('prov-economy').innerText = prov.economy;
          updateTopBarUI();
        } else {
          showModal("Thiếu Ngân Sách", "Bạn cần ít nhất 100 vàng để nâng cấp kinh tế!");
        }
      };

      // Tấn công
      document.getElementById('btn-action-attack').onclick = () => {
        gameState.isAttackMode = true;
        document.getElementById('prov-target-info').classList.remove('hidden');
      };

      // Kết thúc lượt
      document.getElementById('btn-end-turn').onclick = processEndTurn;

      // Modal Button
      document.getElementById('modal-close').onclick = hideModal;
    }

    function executeAttackOrMove(fromId, toId) {
      const fromProv = gameState.provinces[fromId];
      const toProv = gameState.provinces[toId];

      if (!fromProv || !toProv) return;

      if (fromProv.troops <= 1) {
        showModal("Không Thể Ra Quân", "Cần giữ lại ít nhất 1 quân để phòng thủ!");
        clearSelection();
        return;
      }

      const attackingTroops = fromProv.troops - 1;
      fromProv.troops = 1;

      // DI CHUYỂN CÙNG QUỐC GIA
      if (fromProv.owner === toProv.owner) {
        toProv.troops += attackingTroops;
        showModal("Di Chuyển Quân", `Đã chuyển ${attackingTroops} quân tới tỉnh ${toId.replace(/_/g, ' ')}.`);
      } 
      // TẤN CÔNG ĐỊCH
      else {
        const defenderTroops = toProv.troops;
        
        if (attackingTroops > defenderTroops) {
          const remainingAttacker = attackingTroops - defenderTroops;
          const oldOwner = toProv.owner;
          
          toProv.owner = fromProv.owner;
          toProv.troops = remainingAttacker;

          renderMapColors();

          showModal("CHIẾN THẮNG! 🎉", `Quân ta đã đánh bại ${oldOwner} và chiếm thành công tỉnh ${toId.replace(/_/g, ' ')}! Lực lượng còn lại: ${remainingAttacker}.`);
        } else {
          const remainingDefender = defenderTroops - attackingTroops;
          toProv.troops = Math.max(1, remainingDefender);

          showModal("THẤT BẠI 💥", `Quân ta bị đẩy lùi tại ${toId.replace(/_/g, ' ')}. Quân địch còn lại ${toProv.troops} lính.`);
        }
      }

      clearSelection();
      updateTopBarUI();
    }

    // --- 7. VÒNG LẶP LƯỢT CHƠI & AI ---
    function processEndTurn() {
      gameState.turn++;

      // Cộng tiền theo số kinh tế tỉnh
      Object.keys(gameState.countries).forEach(cName => {
        let totalIncome = 0;
        Object.values(gameState.provinces).forEach(p => {
          if (p.owner === cName) {
            totalIncome += p.economy;
          }
        });
        gameState.countries[cName].gold += totalIncome;
      });

      // AI Máy tự nâng cấp
      processSimpleAI();

      updateTopBarUI();
      renderMapColors();
      clearSelection();

      showModal(`Lượt ${gameState.turn}`, `Bắt đầu lượt chơi mới! Thu nhập thuế đã được chuyển vào ngân sách.`);
    }

    function processSimpleAI() {
      Object.keys(gameState.countries).forEach(cName => {
        if (cName === gameState.playerCountry) return;

        const myProvinces = Object.values(gameState.provinces).filter(p => p.owner === cName);
        if (myProvinces.length === 0) return;

        const randomProv = myProvinces[Math.floor(Math.random() * myProvinces.length)];
        const country = gameState.countries[cName];

        if (country.gold >= 50) {
          country.gold -= 50;
          randomProv.troops += 5;
        }
      });
    }

    // --- 8. UI UPDATES ---
    function updateTopBarUI() {
      const pCountry = gameState.countries[gameState.playerCountry];
      if (!pCountry) return;

      document.getElementById('player-name-display').innerText = gameState.playerName;
      document.getElementById('player-country-display').innerText = pCountry.name;
      document.getElementById('player-flag').style.backgroundColor = pCountry.color;
      document.getElementById('player-gold').innerText = pCountry.gold;
      
      let income = 0;
      let totalTroops = 0;
      Object.values(gameState.provinces).forEach(p => {
        if (p.owner === gameState.playerCountry) {
          income += p.economy;
          totalTroops += p.troops;
        }
      });

      document.getElementById('player-income').innerText = `(+${income})`;
      document.getElementById('player-total-troops').innerText = totalTroops;
      document.getElementById('current-turn').innerText = gameState.turn;
    }

    function showModal(title, bodyText) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerText = bodyText;

      const modal = document.getElementById('game-modal');
      const box = document.getElementById('modal-box');

      modal.classList.remove('opacity-0', 'pointer-events-none');
      box.classList.remove('scale-95');
      box.classList.add('scale-100');
    }

    function hideModal() {
      const modal = document.getElementById('game-modal');
      const box = document.getElementById('modal-box');

      modal.classList.add('opacity-0', 'pointer-events-none');
      box.classList.remove('scale-100');
      box.classList.add('scale-95');
    }
  </script>
</body>
</html>
